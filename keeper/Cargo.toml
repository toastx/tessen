[package]
name = "tessen-keeper"
version = "0.1.0"
edition = "2021"

# Detached from the on-chain workspace on purpose: the program's build is
# fragile (see CLAUDE.md) and must not have client-only deps folded into its
# lockfile. This crate keeps its own Cargo.lock.
[workspace]

[[bin]]
name = "tessen-keeper"
path = "src/main.rs"

[dependencies]
anchor-client = "0.32.2"
# Both already in the tree via anchor-client -> solana-rpc-client; `rustls-tls`
# matches the TLS stack that's already enabled there, so this pulls in no new
# TLS backend. `blocking` is used from a dedicated thread, never inside a runtime.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
dotenvy = "0.15"
# host build of the program crate for its account/instruction types only
tessen = { path = "../programs/tessen", features = ["no-entrypoint"] }

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
